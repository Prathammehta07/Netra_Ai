version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: swasthmitra-db
    environment:
      POSTGRES_USER: swasth_user
      POSTGRES_PASSWORD: swasth_password
      POSTGRES_DB: swasthmitra_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ai-service:
    build: ./ai-service
    container_name: swasthmitra-ai
    environment:
      - AI_MODE=demo
      - PORT=8000
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    container_name: swasthmitra-backend
    environment:
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=swasthmitra_super_secret_jwt_key_2026
      - AI_SERVICE_URL=http://ai-service:8000
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - ai-service

  frontend:
    build: ./frontend
    container_name: swasthmitra-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
